name: dotnet build + test with MSB4166 retry
description: >
  Runs `dotnet restore`, `dotnet build`, and `dotnet test` for a solution,
  with a targeted retry loop around MSB4166 "Child node exited prematurely"
  failures. That error is a self-hosted-runner resource-crunch flake
  (typically parallel MSBuild worker OOM) — not a code failure. Every
  other build failure fails fast on the first attempt, so a real broken
  build never masquerades as a flake.

  Log discipline: each build attempt is captured to `build-attempt-N.log`
  in the workspace + uploaded as an artifact so post-mortems can see the
  crash on the first attempt even after a successful retry.

  Version: v1 — see README for the versioning contract (@v1 is a rolling
  major-version tag; specific v1.x.y tags are immutable).

# Composite actions can't emit outputs from shell steps directly without
# writing to $GITHUB_OUTPUT; the run step does that when needed. This
# action doesn't need outputs today — callers care about pass/fail.
inputs:
  solution:
    description: >
      Path to the .sln or .slnx file to restore, build, and test.
    required: true
  configuration:
    description: MSBuild configuration (Debug/Release).
    required: false
    default: Release
  version:
    description: >
      Value passed to `-p:Version=` on both build and publish so the
      compiled assemblies carry the release-tag version. Callers
      typically compute this from `github.event.release.tag_name`
      (release event) or a `<last-tag>-<env>-<sha7>` scheme
      (workflow_dispatch / push).
    required: true
  test-filter:
    description: >
      Value passed to `dotnet test --filter`. Empty string skips the
      filter. Use e.g. `FullyQualifiedName!~ValidHunt.E2E` to exclude
      E2E tests from the pre-deploy sweep.
    required: false
    default: ""
  max-attempts:
    description: >
      Maximum number of build attempts before giving up. Only MSB4166
      failures consume an attempt; other failures fail on the first
      attempt regardless of this value.
    required: false
    default: "2"
  backoff-seconds:
    description: >
      Seconds to sleep between build attempts. Gives the runner time
      to reclaim memory / file descriptors that led to the parallel
      worker crash.
    required: false
    default: "30"
  restore-args:
    description: >
      Extra flags to append to `dotnet restore`. Empty by default.
    required: false
    default: ""
  build-args:
    description: >
      Extra flags to append to `dotnet build`. Empty by default. If
      MSB4166 becomes a chronic issue on a caller, this is the escape
      hatch — pass `-m:1` to constrain MSBuild to a single worker
      (slower but immune to the parallel-worker crash).
    required: false
    default: ""
  upload-logs:
    description: >
      When "true" (default), upload build-attempt logs as a workflow
      artifact so a successful-after-retry run still leaves the first
      attempt's failure log available for inspection. Set "false" to
      skip the artifact (e.g. on a workflow that already uploads its
      own logs).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Restore
      shell: bash
      run: |
        set -euo pipefail
        dotnet restore "${{ inputs.solution }}" ${{ inputs.restore-args }}

    - name: Build (with MSB4166 retry)
      shell: bash
      env:
        VH_SLN: ${{ inputs.solution }}
        VH_CONFIG: ${{ inputs.configuration }}
        VH_VERSION: ${{ inputs.version }}
        VH_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        VH_BACKOFF: ${{ inputs.backoff-seconds }}
        VH_BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        set -uo pipefail
        attempt=1
        while : ; do
          logfile="build-attempt-${attempt}.log"
          echo "::group::dotnet build attempt ${attempt} of ${VH_MAX_ATTEMPTS}"
          set +e
          dotnet build "${VH_SLN}" \
            --configuration "${VH_CONFIG}" \
            --no-restore \
            -p:Version="${VH_VERSION}" \
            ${VH_BUILD_ARGS} \
            2>&1 | tee "${logfile}"
          rc=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"

          if [ "${rc}" -eq 0 ]; then
            echo "Build succeeded on attempt ${attempt}."
            break
          fi

          # MSB4166 = MSBuild worker crash. Every other build failure
          # (compilation errors, package resolution, analyzer errors)
          # fails immediately — real breaks never masquerade as flakes.
          if grep -q "MSB4166" "${logfile}" && [ "${attempt}" -lt "${VH_MAX_ATTEMPTS}" ]; then
            echo "::warning::MSB4166 detected on attempt ${attempt}. Sleeping ${VH_BACKOFF}s then retrying."
            sleep "${VH_BACKOFF}"
            attempt=$((attempt + 1))
            continue
          fi

          echo "::error::Build failed on attempt ${attempt} (exit ${rc}) — not a retriable MSB4166 flake or attempts exhausted."
          exit "${rc}"
        done

    - name: Test
      shell: bash
      env:
        VH_SLN: ${{ inputs.solution }}
        VH_CONFIG: ${{ inputs.configuration }}
        VH_TEST_FILTER: ${{ inputs.test-filter }}
      run: |
        set -euo pipefail
        if [ -n "${VH_TEST_FILTER}" ]; then
          dotnet test "${VH_SLN}" \
            --configuration "${VH_CONFIG}" \
            --no-build \
            --verbosity normal \
            --filter "${VH_TEST_FILTER}"
        else
          dotnet test "${VH_SLN}" \
            --configuration "${VH_CONFIG}" \
            --no-build \
            --verbosity normal
        fi

    - name: Upload build attempt logs
      # Runs even when a prior step failed so a hard build break still
      # ships its log. Skipped when the caller opted out.
      if: always() && inputs.upload-logs == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: build-attempt-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: build-attempt-*.log
        if-no-files-found: ignore
        retention-days: 14
