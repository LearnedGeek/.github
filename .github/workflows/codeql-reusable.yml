# Reusable CodeQL workflow for LearnedGeek org repos.
#
# Runs on the shared ani-server-wsl self-hosted runner so it doesn't
# consume GitHub Actions minutes on the org's billing plan (the default
# `dynamic/github-code-quality/codeql` workflow runs on GitHub-hosted
# Ubuntu and gets blocked whenever the org hits its Actions spending cap
# — see LearnedGeek/lakecountryspanish.com#43 for the context).
#
# Callers pass one language per job invocation. Common LG shape (a .NET
# repo analyzing only C#) is:
#
#   jobs:
#     csharp:
#       uses: LearnedGeek/.github/.github/workflows/codeql-reusable.yml@main
#       permissions:
#         contents: read
#         security-events: write
#         actions: read
#       with:
#         language: csharp
#
# For repos that legitimately need multiple languages, call the workflow
# once per language (matrix inputs to reusable workflows are awkward; a
# small caller with 2-3 job blocks is clearer and cheaper on inputs).
#
# Runner-side prerequisites (one-time):
#   - The runner has .NET SDK installed at /usr/share/dotnet at the
#     version pinned in each caller repo's global.json. Callers should
#     ensure that pin is available on the runner OR pass `build-mode:
#     none` if they don't want a build step. See CI-INFRA §1.
#   - github/codeql-action@v3 auto-downloads the CodeQL bundle into
#     ~/.cache/codeql-bundle on first run; subsequent runs reuse it.
#
# Trade-off: ani-server has to be online for CodeQL to complete. If it's
# offline the queued job waits until the runner comes back. For the LG
# fleet's cadence this is acceptable — same reasoning as ci.yml and the
# deploy workflows.

name: CodeQL (reusable)

on:
  workflow_call:
    inputs:
      language:
        description: 'CodeQL language identifier (csharp, javascript, python, etc.)'
        required: true
        type: string
      build-mode:
        description: 'CodeQL build mode: autobuild (default), manual, or none'
        required: false
        type: string
        default: autobuild
      # When build-mode is 'manual', the caller supplies a build command
      # via this input. Ignored otherwise.
      build-command:
        description: 'Shell command to build the project when build-mode=manual'
        required: false
        type: string
        default: ''

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  analyze:
    name: Analyze (${{ inputs.language }})
    runs-on: [self-hosted, linux, ani-server-wsl]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No setup-dotnet — self-hosted runner has .NET pre-installed at
      # /usr/share/dotnet. See CI-INFRA §1. Callers whose target is not
      # .NET (Python, JS, etc.) can ignore this — CodeQL init only runs
      # dotnet if the language extractor needs it.
      - name: Verify pinned SDK is present
        if: inputs.language == 'csharp'
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}

      # Manual build path: caller supplies the command. Common for
      # multi-project solutions or repos that need pre-build steps
      # (envsubst on appsettings, Tailwind CSS compile, etc.).
      - name: Manual build
        if: inputs.build-mode == 'manual' && inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ inputs.language }}'
